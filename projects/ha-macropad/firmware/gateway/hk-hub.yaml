# HK hub: an ESP32-C3 SuperMini on USB power that relays the HK remote to Home Assistant.
# Put this file and the hk/ folder in your ESPHome config folder (/config/esphome on HA OS).

substitutions:
  name: hk-hub
  friendly_name: HK Hub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret hk_hub_api_key

ota:
  - platform: esphome
    password: !secret hk_hub_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The SuperMini's chip antenna is badly matched: at full power it often never finishes
  # joining ("Auth Expired" in the log). 8.5 dB is the usual fix for these boards.
  output_power: 8.5dB
  ap:
    ssid: HK Hub Fallback
    password: !secret hk_hub_fallback_password

captive_portal:

packages:
  hk: !include hk/hk-gateway.yaml
