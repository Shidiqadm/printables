; HK remote firmware: Seeed XIAO ESP32-C3, Arduino framework.
; Build:  pio run            (from this folder)
; Flash:  pio run -t upload  (USB-C; hold BOOT while plugging in if it won't connect)

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32c3
framework = arduino
; 80 MHz is the lowest clock Wi-Fi runs at, and saves power on every wake
board_build.f_cpu = 80000000L
monitor_speed = 115200
; The board already sets ARDUINO_USB_CDC_ON_BOOT=1: Serial goes over USB, so D6/D7
; (UART0 TX/RX) stay free for the key LEDs.
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_flags = -Wall -Wextra
