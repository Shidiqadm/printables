[project]
name = "prints"
version = "0.1.0"
description = "Parametric 3D-printable models (build123d) for a Bambu Lab A1"
requires-python = ">=3.12"
dependencies = [
    "bd-warehouse>=0.4.0",
    "build123d>=0.13.0",
    "ocp-viewer>=1.1.3",
]

[project.scripts]
new-project = "printlib.cli:new_project"
export-all = "printlib.cli:export_all"
slice = "printlib.slicer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printlib"]
